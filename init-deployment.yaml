
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-init
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-init
  template:
    metadata:
      labels:
        app: nginx-init
    spec:
      initContainers:
        - name: wait-for-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nslookup nginx-init.default.svc.cluster.local >/dev/null 2>&1; do
                echo "Waiting for Service nginx-init..."
                sleep 2
              done
              echo "Service nginx-init found!"

      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
